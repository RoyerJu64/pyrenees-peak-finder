name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  geometry:
    name: Geometrie (TypeScript)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pas de cle `version` : elle entrerait en conflit avec le champ
      # `packageManager` de package.json, qui fait autorite.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  dataset:
    name: Dataset (SQLite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Aucun acces reseau : la base versionnee est controlee telle quelle.
      # Les etapes fetch et enrich se lancent a la main, quand on veut
      # rafraichir les donnees.
      - run: python3 data/scripts/validate_dataset.py
